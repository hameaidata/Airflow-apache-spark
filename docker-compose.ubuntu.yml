# ============================================================================
# AIRFLOW 2.x + SPARK - STACK ESCALABLE  ::  VERSION UBUNTU / LINUX
# ----------------------------------------------------------------------------
# Requisitos: docker-ce + docker-compose-plugin, usuario en el grupo "docker"
# Arranque:   ./setup.sh  &&  docker compose -f docker-compose.ubuntu.yml up -d
# Escalar:    docker compose -f docker-compose.ubuntu.yml up -d --scale airflow-worker=5
#
# DIFERENCIAS vs Windows:
#   - user: "${AIRFLOW_UID}:0"  -> los logs quedan con TU uid, no root
#   - logs en bind mount ./airflow/logs (legibles con tail/grep desde el host)
#   - AIRFLOW_UID se calcula con  id -u  en setup.sh
# ============================================================================

x-airflow-common: &airflow-common
  image: apache/airflow:${AIRFLOW_IMAGE_TAG:-2.10.5-python3.11}
  # CRITICO EN LINUX: sin esto los logs se crean como root y el host no puede
  # leerlos ni borrarlos. El grupo 0 es requerido por la imagen oficial.
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"

    # --- Base de datos (metastore) -----------------------------------------
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
      postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-airflow}

    # --- Celery (escalado horizontal) --------------------------------------
    AIRFLOW__CELERY__BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    AIRFLOW__CELERY__RESULT_BACKEND: >-
      db+postgresql://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-airflow}
    AIRFLOW__CELERY__WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-8}

    # --- Auto-discovery de DAGs --------------------------------------------
    # Cada N segundos el scheduler re-escanea la carpeta dags/ buscando archivos nuevos.
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: ${DAG_DIR_LIST_INTERVAL:-30}
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 30
    AIRFLOW__SCHEDULER__CATCHUP_BY_DEFAULT: "false"

    # --- Webserver ----------------------------------------------------------
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"

    # Providers extra. Vacio por defecto = arranque rapido.
    # Para produccion, construye una imagen propia (ver Dockerfile) en vez de esto.
    _PIP_ADDITIONAL_REQUIREMENTS: ${PIP_ADDITIONAL_REQUIREMENTS:-}
    PYTHONUNBUFFERED: "1"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/config:/opt/airflow/config
    # En Linux si podemos bind-montar los logs: quedan legibles desde el host.
    - ./airflow/logs:/opt/airflow/logs
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - airflow-network
  restart: unless-stopped

services:

  # ==========================================================================
  # CAPA DE DATOS
  # ==========================================================================

  postgres:
    image: postgres:${POSTGRES_IMAGE_TAG:-16-alpine}
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airflow} -d ${POSTGRES_DB:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - airflow-network
    restart: unless-stopped
    logging: &default-logging
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  redis:
    image: redis:${REDIS_IMAGE_TAG:-7-alpine}
    container_name: airflow-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - airflow-network
    restart: unless-stopped
    logging: *default-logging

  # ==========================================================================
  # INICIALIZACION (corre una vez y termina)
  # ==========================================================================

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    # root para poder arreglar permisos de las carpetas bind-montadas
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        echo "==> Ajustando permisos de carpetas montadas..."
        mkdir -p /opt/airflow/logs /opt/airflow/dags /opt/airflow/plugins /opt/airflow/config
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs /opt/airflow/config
        echo "==> Migrando base de datos..."
        su -c "airflow db migrate" airflow 2>/dev/null || runuser -u airflow -- airflow db migrate
        echo "==> Creando usuario admin..."
        runuser -u airflow -- airflow users create \
          --username "${AIRFLOW_ADMIN_USER:-admin}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin --lastname User \
          --role Admin --email "${AIRFLOW_ADMIN_EMAIL:-admin@example.com}" || true
        echo "==> Creando pools usados por los DAGs de ejemplo..."
        runuser -u airflow -- airflow pools set compute_pool 8 "Pool para tareas de transformacion" || true
        runuser -u airflow -- airflow pools set io_pool      4 "Pool para tareas de I/O a base de datos" || true
        echo "==> Inicializacion completa."
    restart: on-failure
    depends_on:
      <<: *airflow-common-depends-on

  # ==========================================================================
  # AIRFLOW
  # ==========================================================================

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "${AIRFLOW_WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    logging: *default-logging

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    environment:
      <<: *airflow-common-env
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    logging: *default-logging

  # --------------------------------------------------------------------------
  # WORKER CELERY  --  ESTE ES EL SERVICIO ESCALABLE
  #
  #   docker compose -f docker-compose.ubuntu.yml up -d --scale airflow-worker=5
  #
  # OJO: no lleva "container_name" a proposito. Docker necesita generar
  # nombres unicos (airflow-worker-1, -2, -3...) para poder escalar.
  # --------------------------------------------------------------------------
  airflow-worker:
    <<: *airflow-common
    command: celery worker --queues ${WORKER_QUEUES:-default}
    healthcheck:
      test: ["CMD-SHELL", 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"']
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s
    environment:
      <<: *airflow-common-env
      # Da 60s a la tarea para terminar antes de matar el worker al hacer scale-down.
      DUMB_INIT_SETSID: "0"
    stop_grace_period: 60s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    logging: *default-logging

  # Flower: panel de control de los workers Celery
  airflow-flower:
    <<: *airflow-common
    container_name: airflow-flower
    command: celery flower
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5555/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    logging: *default-logging

  # ==========================================================================
  # SPARK
  # ==========================================================================

  spark-master:
    image: bitnami/spark:${SPARK_IMAGE_TAG:-3.5.3}
    container_name: spark-master
    environment:
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: "yes"
      SPARK_RPC_AUTHENTICATION_SECRET: ${SPARK_RPC_SECRET}
      SPARK_RPC_ENCRYPTION_ENABLED: "yes"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "yes"
      SPARK_USER: spark
    volumes:
      - ./spark/jobs:/opt/spark-apps
      - spark_events:/opt/spark-events
    ports:
      - "${SPARK_MASTER_UI_PORT:-8082}:8080"   # UI  (8082 para no chocar con Airflow)
      - "${SPARK_MASTER_PORT:-7077}:7077"      # submit
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - airflow-network
    restart: unless-stopped
    logging: *default-logging

  # --------------------------------------------------------------------------
  # SPARK WORKER  --  TAMBIEN ESCALABLE
  #   docker compose -f docker-compose.ubuntu.yml up -d --scale spark-worker=4
  # --------------------------------------------------------------------------
  spark-worker:
    image: bitnami/spark:${SPARK_IMAGE_TAG:-3.5.3}
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2G}
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_RPC_AUTHENTICATION_ENABLED: "yes"
      SPARK_RPC_AUTHENTICATION_SECRET: ${SPARK_RPC_SECRET}
      SPARK_RPC_ENCRYPTION_ENABLED: "yes"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "yes"
      SPARK_USER: spark
    volumes:
      - ./spark/jobs:/opt/spark-apps
      - spark_events:/opt/spark-events
    depends_on:
      spark-master:
        condition: service_healthy
    networks:
      - airflow-network
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  spark_events:

networks:
  airflow-network:
    name: ${COMPOSE_PROJECT_NAME:-airflow-spark}_network
    driver: bridge
