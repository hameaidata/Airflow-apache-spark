# ============================================================================
# AIRFLOW 2.x + SPARK - STACK ESCALABLE  ::  VERSION UBUNTU / LINUX
# ----------------------------------------------------------------------------
# Requisitos: docker-ce + docker-compose-plugin, usuario en el grupo "docker"
# Arranque:   ./setup.sh  &&  docker compose -f docker-compose.ubuntu.yml up -d
# Escalar:    docker compose -f docker-compose.ubuntu.yml up -d --scale airflow-worker=5
#
# DIFERENCIAS vs Windows:
#   - user: "${AIRFLOW_UID}:0"  -> los logs quedan con TU uid, no root
#   - logs en bind mount ./airflow/logs (legibles con tail/grep desde el host)
#   - AIRFLOW_UID se calcula con  id -u  en setup.sh
# ============================================================================

x-airflow-common: &airflow-common
  # Por defecto la imagen oficial. Tras construir la propia (Dockerfile),
  # pon AIRFLOW_IMAGE=airflow-bsg:2.11.2 en el .env.
  image: ${AIRFLOW_IMAGE:-apache/airflow:${AIRFLOW_IMAGE_TAG:-2.11.2-python3.11}}
  # CRITICO EN LINUX: sin esto los logs se crean como root y el host no puede
  # leerlos ni borrarlos. El grupo 0 es requerido por la imagen oficial.
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"

    # --- Pools de Airflow, leidos por os.environ en los DAGs -------------
    # Sin estas lineas los valores del .env NO llegan al contenedor y el
    # codigo cae siempre a default_pool. El sintoma es desconcertante: se
    # cambia el .env, se reinicia, y no pasa nada -sin ningun error- porque
    # dentro del contenedor esa variable no existe.
    AIRFLOW_POOL_SINGLESTORE: ${AIRFLOW_POOL_SINGLESTORE:-default_pool}
    AIRFLOW_POOL_SQLSERVER: ${AIRFLOW_POOL_SQLSERVER:-default_pool}
    AIRFLOW_POOL_SPARK: ${AIRFLOW_POOL_SPARK:-default_pool}
    # --- Tamano del cluster de Spark -------------------------------------
    # El DAG las lee para avisar cuando CORES_MAX de la Variable deja cores
    # del cluster sin usar, que es el sintoma de "agregue un worker y no
    # pasa nada". Sin pasarlas aqui, dentro del contenedor no existen y la
    # comparacion se hace contra los valores por defecto.
    SPARK_WORKER_REPLICAS: ${SPARK_WORKER_REPLICAS:-1}
    SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}

    # --- Base de datos (metastore) -----------------------------------------
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
      postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-airflow}

    # --- Celery (escalado horizontal) --------------------------------------
    AIRFLOW__CELERY__BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    AIRFLOW__CELERY__RESULT_BACKEND: >-
      db+postgresql://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-airflow}
    AIRFLOW__CELERY__WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-8}

    # --- Auto-discovery de DAGs --------------------------------------------
    # Cada N segundos el scheduler re-escanea la carpeta dags/ buscando archivos nuevos.
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: ${DAG_DIR_LIST_INTERVAL:-30}
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 30
    AIRFLOW__SCHEDULER__CATCHUP_BY_DEFAULT: "false"

    # --- Webserver ----------------------------------------------------------
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"

    # --- Provider JDBC ------------------------------------------------------
    # Sin estos dos flags el hook IGNORA driver_path/driver_class del extra
    # de la Connection y falla con "driver not found" sin explicar por que.
    # Se deshabilitaron por defecto en el provider 4.0.0 (era un vector RCE).
    AIRFLOW__PROVIDERS_JDBC__ALLOW_DRIVER_PATH_IN_EXTRA: "true"
    AIRFLOW__PROVIDERS_JDBC__ALLOW_DRIVER_CLASS_IN_EXTRA: "true"
    JDBC_DRIVER_PATH: /opt/airflow/jars

    # Providers extra. Vacio por defecto = arranque rapido.
    # Para produccion, construye una imagen propia (ver Dockerfile) en vez de esto.
    _PIP_ADDITIONAL_REQUIREMENTS: ${PIP_ADDITIONAL_REQUIREMENTS:-}
    PYTHONUNBUFFERED: "1"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/config:/opt/airflow/config
    # Utilidades de operacion (sync_variables.py, que airflow-init corre en
    # el arranque) y tests. Solo lectura: no hay razon para que un
    # contenedor escriba aqui.
    - ./scripts:/opt/airflow/scripts:ro
    - ./airflow/tests:/opt/airflow/tests:ro
    # spark-submit corre DESDE el worker de Airflow: necesita ver el .py del job
    - ./spark/jobs:/opt/spark-apps
    # area compartida con el cluster de Spark (parquet, checkpoints)
    - spark_data:/opt/spark-data
    # LAS CARPETAS DE PARQUET, CON LAS MISMAS RUTAS QUE EN EL CLUSTER
    #
    # Tienen que estar montadas en los contenedores de Airflow Y en los de
    # Spark, con la MISMA ruta dentro del contenedor. En client mode el
    # driver corre dentro de airflow-worker y los executors en spark-worker:
    # los dos manejan la misma ruta de texto, y si solo uno la tiene montada
    # el fallo no dice "falta un montaje", dice "Mkdirs failed to create" o
    # "Path does not exist", que no se parecen a su causa.
    - ${PARQUET_HOST_DIR:-./data/parquet}:${PARQUET_CONTAINER_DIR:-/data/parquet}
    - ${S2SQL_PARQUET_HOST_DIR:-./data/s2sql}:${S2SQL_PARQUET_CONTAINER_DIR:-/data/s2sql}
    - ${BT2SQL_PARQUET_HOST_DIR:-./data/bt2sql}:${BT2SQL_PARQUET_CONTAINER_DIR:-/data/bt2sql}
    # Sin este montaje, spark-defaults.conf existe en el repo pero NO tiene
    # ningun efecto: el cluster corre con los valores por defecto. Ahi vive
    # fs.permissions.umask-mode 000, que es lo que permite que los executors
    # (uid 185) y las tareas de Airflow (uid 50000) escriban en las mismas
    # carpetas de parquet.
    - ./spark/config/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    # En Linux si podemos bind-montar los logs: quedan legibles desde el host.
    - ./airflow/logs:/opt/airflow/logs
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - airflow-network
  restart: unless-stopped

services:

  # ==========================================================================
  # CAPA DE DATOS
  # ==========================================================================

  postgres:
    image: postgres:${POSTGRES_IMAGE_TAG:-16-alpine}
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airflow} -d ${POSTGRES_DB:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - airflow-network
    restart: unless-stopped
    logging: &default-logging
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  redis:
    image: redis:${REDIS_IMAGE_TAG:-7-alpine}
    container_name: airflow-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - airflow-network
    restart: unless-stopped
    logging: *default-logging

  # ==========================================================================
  # INICIALIZACION (corre una vez y termina)
  # ==========================================================================

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    # root para poder arreglar permisos de las carpetas bind-montadas
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        echo "==> Ajustando permisos de carpetas montadas..."
        mkdir -p /opt/airflow/logs /opt/airflow/dags /opt/airflow/plugins /opt/airflow/config
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs /opt/airflow/config
        echo "==> Migrando base de datos..."
        su -c "airflow db migrate" airflow 2>/dev/null || runuser -u airflow -- airflow db migrate
        echo "==> Creando usuario admin..."
        runuser -u airflow -- airflow users create \
          --username "${AIRFLOW_ADMIN_USER:-admin}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin --lastname User \
          --role Admin --email "${AIRFLOW_ADMIN_EMAIL:-admin@example.com}" || true
        echo "==> Creando connection spark_default..."
        runuser -u airflow -- airflow connections delete spark_default 2>/dev/null || true
        runuser -u airflow -- airflow connections add spark_default \
          --conn-type spark \
          --conn-host spark://spark-master \
          --conn-port 7077 || true
        echo "==> Creando pools usados por los DAGs de ejemplo..."
        runuser -u airflow -- airflow pools set compute_pool 8 "Pool para tareas de transformacion" || true
        runuser -u airflow -- airflow pools set io_pool      4 "Pool para tareas de I/O a base de datos" || true
        echo "==> Publicando Variables que falten (no pisa las existentes)..."
        # --solo-nuevas y no una sincronizacion completa: un `docker compose up`
        # que sobreescribiera las Variables borraria en silencio cualquier
        # edicion hecha por la interfaz -incluido el arreglo de urgencia de las
        # 2 de la madrugada-. Asi un stack nuevo queda configurado solo, y lo
        # que ya existe se respeta.
        #
        # El fallo no corta el arranque: que falte una Variable es visible
        # enseguida -el DAG lo dice en su primera tarea-, mientras que un
        # Airflow que no levanta por esto es mucho peor de diagnosticar. Pero
        # el fallo SI se registra, para que no pase por exito.
        runuser -u airflow -- python /opt/airflow/scripts/sync_variables.py --solo-nuevas \
          || echo "ADVERTENCIA: no se pudieron publicar las Variables. Revise con: sync_variables.py --dry-run"
        echo "==> Inicializacion completa."
    restart: on-failure
    depends_on:
      <<: *airflow-common-depends-on

  # ==========================================================================
  # AIRFLOW
  # ==========================================================================

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    volumes:
      # Se repiten los montajes comunes porque definir "volumes" en el servicio
      # SUSTITUYE por completo la lista del ancla, no la amplia.
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config:/opt/airflow/config
      - ./scripts:/opt/airflow/scripts:ro
      - ./airflow/tests:/opt/airflow/tests:ro
      - ./spark/jobs:/opt/spark-apps
      - spark_data:/opt/spark-data
      - ${PARQUET_HOST_DIR:-./data/parquet}:${PARQUET_CONTAINER_DIR:-/data/parquet}
      - ${S2SQL_PARQUET_HOST_DIR:-./data/s2sql}:${S2SQL_PARQUET_CONTAINER_DIR:-/data/s2sql}
      - ${BT2SQL_PARQUET_HOST_DIR:-./data/bt2sql}:${BT2SQL_PARQUET_CONTAINER_DIR:-/data/bt2sql}
      - ./spark/config/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./airflow/logs:/opt/airflow/logs
      # Configuracion de autenticacion de la UI. Airflow lo busca justo aqui.
      # Si el archivo no existe en el host, Docker crea una CARPETA con ese
      # nombre y el webserver falla al arrancar. Verifica que existe.
      - ./airflow/config/webserver_config.py:/opt/airflow/webserver_config.py:ro
    ports:
      - "${AIRFLOW_WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    logging: *default-logging

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    environment:
      <<: *airflow-common-env
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    logging: *default-logging

  # --------------------------------------------------------------------------
  # WORKER CELERY  --  ESTE ES EL SERVICIO ESCALABLE
  #
  #   docker compose -f docker-compose.ubuntu.yml up -d --scale airflow-worker=5
  #
  # OJO: no lleva "container_name" a proposito. Docker necesita generar
  # nombres unicos (airflow-worker-1, -2, -3...) para poder escalar.
  # --------------------------------------------------------------------------
  airflow-worker:
    <<: *airflow-common
    command: celery worker --queues ${WORKER_QUEUES:-default}
    # Numero de workers por defecto. Se puede sobrescribir en caliente con:
    #   docker compose -f <archivo> up -d --scale airflow-worker=N
    deploy:
      replicas: ${AIRFLOW_WORKER_REPLICAS:-2}
    healthcheck:
      test: ["CMD-SHELL", 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"']
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s
    environment:
      <<: *airflow-common-env
      # Da 60s a la tarea para terminar antes de matar el worker al hacer scale-down.
      DUMB_INIT_SETSID: "0"
    stop_grace_period: 60s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    logging: *default-logging

  # Flower: panel de control de los workers Celery
  airflow-flower:
    <<: *airflow-common
    container_name: airflow-flower
    command: celery flower
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5555/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    logging: *default-logging

  # ==========================================================================
  # SPARK
  # ==========================================================================

  # --------------------------------------------------------------------------
  # PERMISOS DE LOS VOLUMENES COMPARTIDOS
  #
  # La imagen oficial apache/spark corre como el usuario "spark" (uid 185).
  # Los contenedores de Airflow corren como uid 50000. Un volumen nombrado
  # recien creado pertenece a root, asi que NINGUNO de los dos puede escribir.
  #
  # Este contenedor corre una vez, ajusta los permisos y termina.
  # El 777 es para desarrollo: es un area de trabajo compartida entre dos
  # usuarios distintos. En produccion esto va en almacenamiento externo
  # (S3, HDFS, NFS) con permisos gestionados de verdad, no en un volumen local.
  # --------------------------------------------------------------------------
  spark-init:
    image: busybox:1.36
    container_name: spark-init
    command: sh -c "mkdir -p /data /events && chmod -R 777 /data /events && echo 'permisos ajustados'"
    volumes:
      - spark_data:/data
      - spark_events:/events
    networks:
      - airflow-network
    restart: "no"

  # --------------------------------------------------------------------------
  # SPARK MASTER
  #
  # OJO — DIFERENCIA CLAVE CON BITNAMI:
  # Las variables SPARK_MODE, SPARK_MASTER_URL, SPARK_WORKER_MEMORY y todas las
  # SPARK_RPC_* NO EXISTEN en Spark. Son invento del entrypoint de Bitnami.
  # La imagen oficial las ignora por completo: no hay nada que las lea.
  #
  # Con apache/spark hay que invocar la clase Java directamente, que es lo que
  # Bitnami hacia por debajo.
  # --------------------------------------------------------------------------
  spark-master:
    image: ${SPARK_IMAGE:-apache/spark:${SPARK_IMAGE_TAG:-3.5.3-scala2.12-java17-python3-ubuntu}}
    container_name: spark-master
    # Se sobrescribe el entrypoint de la imagen (pensado para Kubernetes) para
    # que el arranque sea determinista y no dependa de su modo pass-through.
    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    environment:
      # Opciones JVM del master. Aqui se activa la autenticacion (ver abajo).
      SPARK_MASTER_OPTS: ${SPARK_MASTER_OPTS:-}
      SPARK_PUBLIC_DNS: spark-master
    volumes:
      - ./spark/jobs:/opt/spark-apps
      - spark_events:/opt/spark-events
      - spark_data:/opt/spark-data
      - ./spark/config/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ${PARQUET_HOST_DIR:-./data/parquet}:${PARQUET_CONTAINER_DIR:-/data/parquet}
      - ${S2SQL_PARQUET_HOST_DIR:-./data/s2sql}:${S2SQL_PARQUET_CONTAINER_DIR:-/data/s2sql}
      - ${BT2SQL_PARQUET_HOST_DIR:-./data/bt2sql}:${BT2SQL_PARQUET_CONTAINER_DIR:-/data/bt2sql}
    ports:
      - "${SPARK_MASTER_UI_PORT:-8082}:8080"   # UI  (8082 para no chocar con Airflow)
      - "${SPARK_MASTER_PORT:-7077}:7077"      # submit
    # La imagen oficial NO trae curl. El healthcheck anterior fallaba siempre,
    # el master nunca llegaba a "healthy" y el worker se quedaba esperando para
    # siempre por el depends_on. Esta prueba usa solo bash: abre un socket TCP.
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/localhost/8080' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      spark-init:
        condition: service_completed_successfully
    networks:
      - airflow-network
    restart: unless-stopped
    logging: *default-logging

  # --------------------------------------------------------------------------
  # SPARK WORKER  --  ESCALABLE
  #   docker compose -f docker-compose.ubuntu.yml up -d --scale spark-worker=3
  #
  # --cores y --memory van como ARGUMENTOS explicitos, no como variables de
  # entorno. Asi no dependemos de que la clase Worker las lea del entorno.
  # --------------------------------------------------------------------------
  spark-worker:
    image: ${SPARK_IMAGE:-apache/spark:${SPARK_IMAGE_TAG:-3.5.3-scala2.12-java17-python3-ubuntu}}
    deploy:
      replicas: ${SPARK_WORKER_REPLICAS:-1}
    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "${SPARK_WORKER_CORES:-2}"
      - --memory
      - "${SPARK_WORKER_MEMORY:-2G}"
      - --webui-port
      - "8081"
    environment:
      SPARK_WORKER_OPTS: ${SPARK_WORKER_OPTS:-}
    volumes:
      - ./spark/jobs:/opt/spark-apps
      - spark_events:/opt/spark-events
      - spark_data:/opt/spark-data
      - ./spark/config/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ${PARQUET_HOST_DIR:-./data/parquet}:${PARQUET_CONTAINER_DIR:-/data/parquet}
      - ${S2SQL_PARQUET_HOST_DIR:-./data/s2sql}:${S2SQL_PARQUET_CONTAINER_DIR:-/data/s2sql}
      - ${BT2SQL_PARQUET_HOST_DIR:-./data/bt2sql}:${BT2SQL_PARQUET_CONTAINER_DIR:-/data/bt2sql}
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/localhost/8081' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      spark-master:
        condition: service_healthy
      # spark-init es quien deja escribibles los volumenes spark_data y
      # spark_events. spark-master y spark-history ya dependian de el; el
      # worker no, y es el que MAS los usa. Al escalar con --scale, un worker
      # nuevo podia arrancar antes de que los permisos estuvieran puestos.
      spark-init:
        condition: service_completed_successfully
    networks:
      - airflow-network
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres_data:
  spark_data:
  redis_data:
  spark_events:

networks:
  airflow-network:
    name: ${COMPOSE_PROJECT_NAME:-airflow-spark}_network
    driver: bridge
