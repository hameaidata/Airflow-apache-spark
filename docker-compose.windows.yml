# ============================================================================
# AIRFLOW 2.x + SPARK - STACK ESCALABLE  ::  VERSION WINDOWS
# ----------------------------------------------------------------------------
# Requisitos: Docker Desktop con backend WSL2 (Settings > General > Use WSL 2)
# Arranque:   docker compose -f docker-compose.windows.yml up -d
# Escalar:    docker compose -f docker-compose.windows.yml up -d --scale airflow-worker=5
#
# DIFERENCIAS vs Ubuntu:
#   - AIRFLOW_UID fijo en 50000 (Windows no tiene UID de usuario POSIX)
#   - logs en volumen nombrado, NO bind mount (evita problemas de permisos NTFS)
#   - sin directiva "user:" (Docker Desktop gestiona el mapeo)
# ============================================================================

x-airflow-common: &airflow-common
  # Por defecto la imagen oficial. Tras construir la propia (Dockerfile),
  # pon AIRFLOW_IMAGE=airflow-bsg:2.11.2 en el .env.
  image: ${AIRFLOW_IMAGE:-apache/airflow:${AIRFLOW_IMAGE_TAG:-2.11.2-python3.11}}
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"

    # --- Base de datos (metastore) -----------------------------------------
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
      postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-airflow}

    # --- Celery (escalado horizontal) --------------------------------------
    AIRFLOW__CELERY__BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    AIRFLOW__CELERY__RESULT_BACKEND: >-
      db+postgresql://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-airflow}
    AIRFLOW__CELERY__WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-8}

    # --- Auto-discovery de DAGs --------------------------------------------
    # Cada N segundos el scheduler re-escanea la carpeta dags/ buscando archivos nuevos.
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: ${DAG_DIR_LIST_INTERVAL:-30}
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 30
    AIRFLOW__SCHEDULER__CATCHUP_BY_DEFAULT: "false"

    # --- Webserver ----------------------------------------------------------
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"

    # --- Provider JDBC ------------------------------------------------------
    # Sin estos dos flags el hook IGNORA driver_path/driver_class del extra
    # de la Connection y falla con "driver not found" sin explicar por que.
    # Se deshabilitaron por defecto en el provider 4.0.0 (era un vector RCE).
    AIRFLOW__PROVIDERS_JDBC__ALLOW_DRIVER_PATH_IN_EXTRA: "true"
    AIRFLOW__PROVIDERS_JDBC__ALLOW_DRIVER_CLASS_IN_EXTRA: "true"
    JDBC_DRIVER_PATH: /opt/airflow/jars

    # Providers extra. Vacio por defecto = arranque rapido.
    # Para produccion, construye una imagen propia (ver Dockerfile) en vez de esto.
    _PIP_ADDITIONAL_REQUIREMENTS: ${PIP_ADDITIONAL_REQUIREMENTS:-}
    AIRFLOW_UID: "50000"
    PYTHONUNBUFFERED: "1"
  volumes:
    # Bind mounts: editas en Windows, el contenedor lo ve al instante.
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/config:/opt/airflow/config
    # spark-submit corre DESDE el worker de Airflow: necesita ver el .py del job
    - ./spark/jobs:/opt/spark-apps
    # area compartida con el cluster de Spark (parquet, checkpoints)
    - spark_data:/opt/spark-data
    # Logs en volumen nombrado: evita errores de permisos de NTFS.
    # Para leerlos: docker compose logs, o la UI de Airflow.
    - airflow_logs:/opt/airflow/logs
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - airflow-network
  restart: unless-stopped

services:

  # ==========================================================================
  # CAPA DE DATOS
  # ==========================================================================

  postgres:
    image: postgres:${POSTGRES_IMAGE_TAG:-16-alpine}
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airflow} -d ${POSTGRES_DB:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - airflow-network
    restart: unless-stopped
    logging: &default-logging
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  redis:
    image: redis:${REDIS_IMAGE_TAG:-7-alpine}
    container_name: airflow-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - airflow-network
    restart: unless-stopped
    logging: *default-logging

  # ==========================================================================
  # INICIALIZACION (corre una vez y termina)
  # ==========================================================================

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        echo "==> Migrando base de datos..."
        airflow db migrate
        echo "==> Creando usuario admin..."
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER:-admin}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin --lastname User \
          --role Admin --email "${AIRFLOW_ADMIN_EMAIL:-admin@example.com}" || true
        echo "==> Creando connection spark_default..."
        airflow connections delete spark_default 2>/dev/null || true
        airflow connections add spark_default \
          --conn-type spark \
          --conn-host spark://spark-master \
          --conn-port 7077 || true
        echo "==> Creando pools usados por los DAGs de ejemplo..."
        airflow pools set compute_pool 8  "Pool para tareas de transformacion" || true
        airflow pools set io_pool      4  "Pool para tareas de I/O a base de datos" || true
        echo "==> Inicializacion completa."
    restart: on-failure
    depends_on:
      <<: *airflow-common-depends-on

  # ==========================================================================
  # AIRFLOW
  # ==========================================================================

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    volumes:
      # Se repiten los montajes comunes porque definir "volumes" en el servicio
      # SUSTITUYE por completo la lista del ancla, no la amplia.
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config:/opt/airflow/config
      - ./spark/jobs:/opt/spark-apps
      - spark_data:/opt/spark-data
      - airflow_logs:/opt/airflow/logs
      # Configuracion de autenticacion de la UI. Airflow lo busca justo aqui.
      # Si el archivo no existe en el host, Docker crea una CARPETA con ese
      # nombre y el webserver falla al arrancar. Verifica que existe.
      - ./airflow/config/webserver_config.py:/opt/airflow/webserver_config.py:ro
    ports:
      - "${AIRFLOW_WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    logging: *default-logging

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    environment:
      <<: *airflow-common-env
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    logging: *default-logging

  # --------------------------------------------------------------------------
  # WORKER CELERY  --  ESTE ES EL SERVICIO ESCALABLE
  #
  #   docker compose -f docker-compose.windows.yml up -d --scale airflow-worker=5
  #
  # OJO: no lleva "container_name" a proposito. Docker necesita generar
  # nombres unicos (airflow-worker-1, -2, -3...) para poder escalar.
  # --------------------------------------------------------------------------
  airflow-worker:
    <<: *airflow-common
    command: celery worker --queues ${WORKER_QUEUES:-default}
    # Numero de workers por defecto. Se puede sobrescribir en caliente con:
    #   docker compose -f <archivo> up -d --scale airflow-worker=N
    deploy:
      replicas: ${AIRFLOW_WORKER_REPLICAS:-2}
    healthcheck:
      test: ["CMD-SHELL", 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"']
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s
    environment:
      <<: *airflow-common-env
      # Da 60s a la tarea para terminar antes de matar el worker al hacer scale-down.
      DUMB_INIT_SETSID: "0"
    stop_grace_period: 60s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    logging: *default-logging

  # Flower: panel de control de los workers Celery
  airflow-flower:
    <<: *airflow-common
    container_name: airflow-flower
    command: celery flower
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5555/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    logging: *default-logging

  # ==========================================================================
  # SPARK
  # ==========================================================================

  # --------------------------------------------------------------------------
  # PERMISOS DE LOS VOLUMENES COMPARTIDOS
  #
  # La imagen oficial apache/spark corre como el usuario "spark" (uid 185).
  # Los contenedores de Airflow corren como uid 50000. Un volumen nombrado
  # recien creado pertenece a root, asi que NINGUNO de los dos puede escribir.
  #
  # Este contenedor corre una vez, ajusta los permisos y termina.
  # El 777 es para desarrollo: es un area de trabajo compartida entre dos
  # usuarios distintos. En produccion esto va en almacenamiento externo
  # (S3, HDFS, NFS) con permisos gestionados de verdad, no en un volumen local.
  # --------------------------------------------------------------------------
  spark-init:
    image: busybox:1.36
    container_name: spark-init
    command: sh -c "mkdir -p /data /events && chmod -R 777 /data /events && echo 'permisos ajustados'"
    volumes:
      - spark_data:/data
      - spark_events:/events
    networks:
      - airflow-network
    restart: "no"

  # --------------------------------------------------------------------------
  # SPARK MASTER
  #
  # OJO — DIFERENCIA CLAVE CON BITNAMI:
  # Las variables SPARK_MODE, SPARK_MASTER_URL, SPARK_WORKER_MEMORY y todas las
  # SPARK_RPC_* NO EXISTEN en Spark. Son invento del entrypoint de Bitnami.
  # La imagen oficial las ignora por completo: no hay nada que las lea.
  #
  # Con apache/spark hay que invocar la clase Java directamente, que es lo que
  # Bitnami hacia por debajo.
  # --------------------------------------------------------------------------
  spark-master:
    image: ${SPARK_IMAGE:-apache/spark:${SPARK_IMAGE_TAG:-3.5.3}}
    container_name: spark-master
    # Se sobrescribe el entrypoint de la imagen (pensado para Kubernetes) para
    # que el arranque sea determinista y no dependa de su modo pass-through.
    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    environment:
      # Opciones JVM del master. Aqui se activa la autenticacion (ver abajo).
      SPARK_MASTER_OPTS: ${SPARK_MASTER_OPTS:-}
      SPARK_PUBLIC_DNS: spark-master
    volumes:
      - ./spark/jobs:/opt/spark-apps
      - spark_events:/opt/spark-events
      - spark_data:/opt/spark-data
    ports:
      - "${SPARK_MASTER_UI_PORT:-8082}:8080"   # UI  (8082 para no chocar con Airflow)
      - "${SPARK_MASTER_PORT:-7077}:7077"      # submit
    # La imagen oficial NO trae curl. El healthcheck anterior fallaba siempre,
    # el master nunca llegaba a "healthy" y el worker se quedaba esperando para
    # siempre por el depends_on. Esta prueba usa solo bash: abre un socket TCP.
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/localhost/8080' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      spark-init:
        condition: service_completed_successfully
    networks:
      - airflow-network
    restart: unless-stopped
    logging: *default-logging

  # --------------------------------------------------------------------------
  # SPARK WORKER  --  ESCALABLE
  #   docker compose -f docker-compose.windows.yml up -d --scale spark-worker=3
  #
  # --cores y --memory van como ARGUMENTOS explicitos, no como variables de
  # entorno. Asi no dependemos de que la clase Worker las lea del entorno.
  # --------------------------------------------------------------------------
  spark-worker:
    image: ${SPARK_IMAGE:-apache/spark:${SPARK_IMAGE_TAG:-3.5.3}}
    deploy:
      replicas: ${SPARK_WORKER_REPLICAS:-1}
    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "${SPARK_WORKER_CORES:-2}"
      - --memory
      - "${SPARK_WORKER_MEMORY:-2G}"
      - --webui-port
      - "8081"
    environment:
      SPARK_WORKER_OPTS: ${SPARK_WORKER_OPTS:-}
    volumes:
      - ./spark/jobs:/opt/spark-apps
      - spark_events:/opt/spark-events
      - spark_data:/opt/spark-data
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/localhost/8081' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      spark-master:
        condition: service_healthy
    networks:
      - airflow-network
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres_data:
  spark_data:
  redis_data:
  airflow_logs:
  spark_events:

networks:
  airflow-network:
    name: ${COMPOSE_PROJECT_NAME:-airflow-spark}_network
    driver: bridge
