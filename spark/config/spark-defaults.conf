# ============================================================================
# Referencia de configuracion del CLIENTE de Spark (lado Airflow)
# ----------------------------------------------------------------------------
# AVISO: este archivo NO se monta automaticamente en ningun contenedor.
#
# En el modelo de este stack, quien envia los jobs es el worker de Airflow
# (client mode). Lo que de verdad manda es el diccionario `conf={...}` del
# SparkSubmitOperator en el DAG, porque viaja con cada envio y queda registrado
# en el log de la tarea. Un archivo montado es invisible en la traza.
#
# Este archivo sirve como referencia de los valores recomendados, y para
# montarlo en /opt/spark/conf/spark-defaults.conf si algun dia prefieres
# centralizarlo.
# ============================================================================

# --- Rendimiento ------------------------------------------------------------
spark.sql.adaptive.enabled                      true
spark.sql.adaptive.coalescePartitions.enabled   true
spark.serializer                                org.apache.spark.serializer.KryoSerializer

# Techo de cores por aplicacion. SIN ESTO la primera app que llega toma todos
# los cores del cluster y las siguientes se quedan en WAITING indefinidamente.
spark.cores.max                                 4

# --- Compatibilidad de fechas en Parquet ------------------------------------
# Sin esto, escribir fechas anteriores a 1582 lanza excepcion.
spark.sql.parquet.datetimeRebaseModeInWrite     CORRECTED

# --- Autenticacion (desactivada por defecto) --------------------------------
# Si la activas aqui, tiene que estar tambien en SPARK_MASTER_OPTS y
# SPARK_WORKER_OPTS del .env, con el MISMO secreto.
# spark.authenticate                            true
# spark.authenticate.secret                     EL_SECRETO
# spark.network.crypto.enabled                  true
# spark.io.encryption.enabled                   true

# --- Event log (desactivado por defecto) ------------------------------------
# Requiere que /opt/spark-events exista y sea escribible por uid 185.
# El servicio spark-init del compose ya lo prepara, pero ademas necesitas
# levantar un History Server para poder consultarlo. Actívalo cuando lo tengas.
# spark.eventLog.enabled                        true
# spark.eventLog.dir                            /opt/spark-events
# spark.eventLog.compress                       true
