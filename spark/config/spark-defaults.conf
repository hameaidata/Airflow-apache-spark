# ============================================================================
# Spark defaults
# Montar en: /opt/bitnami/spark/conf/spark-defaults.conf
# ============================================================================

spark.master                          spark://spark-master:7077

# --- Recursos (ajusta a tu hardware) ----------------------------------------
spark.driver.memory                   1g
spark.executor.memory                 2g
spark.executor.cores                  2
spark.sql.shuffle.partitions          200

# --- Seguridad --------------------------------------------------------------
# El secreto se inyecta por variable de entorno SPARK_RPC_AUTHENTICATION_SECRET
# desde el compose. NO lo pongas en texto plano aqui.
spark.authenticate                    true
spark.network.crypto.enabled          true
spark.io.encryption.enabled           true

# --- Event log (para el History Server) -------------------------------------
spark.eventLog.enabled                true
spark.eventLog.dir                    /opt/spark-events
spark.eventLog.compress               true
spark.history.fs.logDirectory         /opt/spark-events

# --- Rendimiento ------------------------------------------------------------
spark.sql.adaptive.enabled                        true
spark.sql.adaptive.coalescePartitions.enabled     true
spark.serializer                      org.apache.spark.serializer.KryoSerializer
