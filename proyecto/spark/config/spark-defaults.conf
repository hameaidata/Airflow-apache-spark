# ============================================================================
#  spark-defaults.conf - configuracion por defecto del cluster
# ----------------------------------------------------------------------------
#  Se monta en los contenedores spark-master y spark-worker como
#      /opt/spark/conf/spark-defaults.conf
#
#  IMPORTANTE: hasta ahora este archivo existia en el repositorio pero NINGUN
#  servicio del docker-compose lo montaba, asi que no tenia ningun efecto: el
#  cluster corria con los valores por defecto de Spark. Ya esta montado en los
#  dos compose.
#
#  Lo que se envia con --conf desde spark-submit GANA sobre lo de aqui, asi que
#  un job puede subir un valor puntual sin tocar este archivo.
# ============================================================================

# --- Rendimiento de consultas ----------------------------------------------
# AQE ajusta el plan con estadisticas reales en tiempo de ejecucion. Es lo que
# evita tener que adivinar el numero de particiones tabla por tabla.
spark.sql.adaptive.enabled                      true
spark.sql.adaptive.coalescePartitions.enabled   true
spark.sql.adaptive.skewJoin.enabled             true

# Kryo serializa mas rapido y ocupa menos que la serializacion de Java.
spark.serializer                                org.apache.spark.serializer.KryoSerializer

# --- RECURSOS ---------------------------------------------------------------
# spark.cores.max TIENE que caber en el worker, o el job no falla: se queda en
# WAITING para siempre con el mensaje
#     "Initial job has not accepted any resources"
# que no dice en ningun momento que el problema sea de capacidad.
#
# Con la configuracion por defecto del .env:
#     SPARK_WORKER_CORES=2   SPARK_WORKER_MEMORY=2G   1 replica
# la capacidad total del cluster es de 2 cores. Pedir mas es pedir que se
# cuelgue.
#
# ESTE VALOR ESTABA EN 4 CONTRA UN CLUSTER DE 2 CORES. Corregido.
# Si escala el worker (SPARK_WORKER_CORES o replicas), suba esto en la misma
# proporcion, y no antes.
spark.cores.max                                 2

# Memoria real que reserva un executor = executor.memory + max(384m, 10%).
# 1g -> 1408m, que cabe en los 2G del worker. Con 2g no cabria.
spark.executor.memory                           1g
spark.executor.cores                            1
spark.driver.memory                             1g

# --- Escritura de Parquet ---------------------------------------------------
# CORRECTED evita la excepcion al escribir fechas anteriores a 1582 (calendario
# juliano contra gregoriano). En datos contables historicos aparece mas de lo
# que uno esperaria, y el mensaje por defecto sugiere corregir los datos cuando
# lo correcto es fijar el modo de rebase.
spark.sql.parquet.datetimeRebaseModeInWrite     CORRECTED
spark.sql.parquet.int96RebaseModeInWrite        CORRECTED
spark.sql.parquet.compression.codec             snappy

# --- Historial de ejecuciones ----------------------------------------------
# El volumen spark_events ya esta montado en los dos contenedores. Sin esto, al
# terminar un job se pierde su interfaz y no queda forma de ver por que tardo.
spark.eventLog.enabled                          true
spark.eventLog.dir                              /opt/spark-events
spark.history.fs.logDirectory                   /opt/spark-events

# --- Zona horaria -----------------------------------------------------------
# Fijarla explicitamente evita que el mismo job de resultados distintos segun
# la zona del contenedor que lo ejecute.
spark.sql.session.timeZone                      America/Lima

# --- NOTA SOBRE LOS DRIVERS JDBC -------------------------------------------
# Aqui NO hay spark.jars, ni spark.driver.extraClassPath, ni
# spark.executor.extraClassPath, y es a proposito: los jars se instalan en
# $SPARK_HOME/jars dentro de la imagen (ver spark/Dockerfile), que es el unico
# sitio que entra en el classpath del driver Y de los executors sin depender de
# como se envio el trabajo.
#
# Si alguna vez ve "java.sql.SQLException: No suitable driver" en un job al que
# SI se le pasaron --jars, la causa es esa: el jar distribuido se carga con un
# classloader distinto del que usa DriverManager.
